# Local development + CI load-test stack. Not used in production (Neon/Upstash/Render).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paycore
      POSTGRES_USER: paycore
      POSTGRES_PASSWORD: paycore
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paycore -d paycore"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # ephemeral, like our usage of Upstash
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    profiles: ["full"]        # `docker compose --profile full up` runs the API too (used by CI's k6 stage)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/paycore
      FLYWAY_URL: jdbc:postgresql://postgres:5432/paycore
      DATABASE_USER: paycore
      DATABASE_PASSWORD: paycore
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-only-jwt-secret-local-only-jwt-secret-0000
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CARD_FINGERPRINT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTERNAL_JOB_TOKEN: local-internal-token
      DEMO_MERCHANT_EMAIL: demo@paycore.dev
      DEMO_MERCHANT_PASSWORD: demo-password
      DEMO_API_KEY: sk_test_localdemo000000000000000000000000
      CHECKOUT_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Load tests set these high from the shell (RATE_LIMIT_CAPACITY=100000 docker compose ...); demos keep 60/min.
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-60}
      RATE_LIMIT_REFILL_PER_SECOND: ${RATE_LIMIT_REFILL_PER_SECOND:-1}
      # Override to compare JVM flag sets under load (see load/README.md).
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom}
    ports: ["8080:8080"]
    # Mirror Render free tier so local numbers are honest.
    mem_limit: 512m
    cpus: 0.5

volumes:
  pgdata:
