spring:
  application:
    name: paycore
  threads:
    virtual:
      enabled: true            # Java 21 virtual threads: blocking JDBC/Redis calls don't pin a platform thread
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Sized for Render free (512 MB / 0.1 CPU) + Neon free (compute must be allowed to suspend).
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: 0          # no idle connections -> Neon can auto-suspend -> stays inside 100 CU-h/month
      idle-timeout: 60000
      max-lifetime: 300000     # PgBouncer/Neon may recycle server connections; keep ours short
      connection-timeout: 15000
      keepalive-time: 0        # never keep Neon awake artificially
      pool-name: paycore
  flyway:
    url: ${FLYWAY_URL:${DATABASE_URL}}   # Neon: DIRECT host for migrations; app traffic goes through the pooler
    user: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL}
      lettuce:
        shutdown-timeout: 100ms
      timeout: 2s
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false           # we own the error envelope (see GlobalExceptionHandler)

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:32}
    max-connections: 200
    accept-count: 50
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Liveness only. Health checks must NOT touch Postgres or Redis:
    # every ping would wake Neon compute (CU-hours) and spend Upstash commands.
    db:
      enabled: false
    redis:
      enabled: false
    diskspace:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    try-it-out-enabled: true
  paths-to-exclude: /internal/**

paycore:
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:60}            # burst
    refill-per-second: ${RATE_LIMIT_REFILL_PER_SECOND:1}   # sustained: 60/min
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:30}
  encryption-key: ${APP_ENCRYPTION_KEY}
  card-fingerprint-key: ${CARD_FINGERPRINT_KEY}
  internal-job-token: ${INTERNAL_JOB_TOKEN}
  checkout-base-url: ${CHECKOUT_BASE_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  demo:
    email: ${DEMO_MERCHANT_EMAIL:demo@paycore.dev}
    password: ${DEMO_MERCHANT_PASSWORD:}
    api-key: ${DEMO_API_KEY:}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.0      # free tier: errors only
  send-default-pii: false

logging:
  level:
    root: INFO
    com.paycore: INFO
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    com.paycore: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs             # JSON logs; MDC (request_id, merchant_id) is included automatically
