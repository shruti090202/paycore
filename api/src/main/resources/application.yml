spring:
  application:
    name: paycore
  threads:
    virtual:
      enabled: true
  datasource:
    # JDBC URL + user/password, or a postgres:// URI (parsed by DatabaseUrlEnvironmentPostProcessor).
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Sized for Render free + Neon free (idle 0 so Neon can suspend).
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 15000
      keepalive-time: 0
      pool-name: paycore
  flyway:
    url: ${FLYWAY_URL:${DATABASE_URL}}   # direct (non-pooled) host for migrations
    user: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL}
      lettuce:
        shutdown-timeout: 100ms
      timeout: 2s
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:32}
    max-connections: 200
    accept-count: 50
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Liveness only: health must not touch Postgres or Redis (free-tier budgets).
    db:
      enabled: false
    redis:
      enabled: false
    diskspace:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    try-it-out-enabled: true
  paths-to-exclude: /internal/**

paycore:
  webhooks:
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:8}
    base-delay-seconds: ${WEBHOOK_BASE_DELAY_SECONDS:10}
    max-delay-seconds: 900
    lease-seconds: 60
    http-timeout-seconds: 10
    batch-size: 25
    allow-private-urls: ${WEBHOOK_ALLOW_PRIVATE_URLS:false}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    interval-ms: 5000
    active-window-seconds: 600
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:60}
    refill-per-second: ${RATE_LIMIT_REFILL_PER_SECOND:1}
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:30}
  encryption-key: ${APP_ENCRYPTION_KEY}
  card-fingerprint-key: ${CARD_FINGERPRINT_KEY}
  internal-job-token: ${INTERNAL_JOB_TOKEN}
  checkout-base-url: ${CHECKOUT_BASE_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  demo:
    email: ${DEMO_MERCHANT_EMAIL:demo@paycore.dev}
    password: ${DEMO_MERCHANT_PASSWORD:}
    api-key: ${DEMO_API_KEY:}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.0
  send-default-pii: false

logging:
  level:
    root: INFO
    com.paycore: INFO
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: local
paycore:
  webhooks:
    allow-private-urls: true
logging:
  level:
    com.paycore: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
