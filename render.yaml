# Render Blueprint for the API. Values marked sync: false are pasted in the Render dashboard (see README, Deployment).
services:
  - type: web
    name: paycore-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CHECKOUT_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: CARD_FINGERPRINT_KEY
        generateValue: true
      - key: INTERNAL_JOB_TOKEN
        generateValue: true
      - key: DEMO_MERCHANT_PASSWORD
        generateValue: true
      - key: DEMO_MERCHANT_EMAIL
        value: demo@paycore.dev
      - key: DEMO_API_KEY
        sync: false
      - key: DB_POOL_MAX
        value: "4"
      - key: TOMCAT_MAX_THREADS
        value: "32"
      - key: WEBHOOK_ALLOW_PRIVATE_URLS
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RATE_LIMIT_CAPACITY
        value: "60"
      - key: RATE_LIMIT_REFILL_PER_SECOND
        value: "1"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
