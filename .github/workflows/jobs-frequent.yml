name: Scheduled jobs (frequent)

# Wakes the API every 15 minutes to drain the webhook outbox and resolve pending bank calls.
# Required repository secrets: API_BASE_URL, INTERNAL_JOB_TOKEN. GitHub disables cron after 60 days without commits.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: jobs-frequent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger jobs
        env:
          API: ${{ secrets.API_BASE_URL }}
          TOKEN: ${{ secrets.INTERNAL_JOB_TOKEN }}
        run: |
          set -u
          if [ -z "$API" ] || [ -z "$TOKEN" ]; then echo "API_BASE_URL / INTERNAL_JOB_TOKEN secrets not set"; exit 1; fi
          for job in webhook-dispatch bank-status-check; do
            echo "== $job"
            curl --silent --show-error --fail-with-body --max-time 120 --retry 4 --retry-delay 20 --retry-all-errors \
              -X POST "$API/internal/jobs/$job" -H "X-Internal-Token: $TOKEN" -H "Content-Type: application/json" -d '{}'
            echo
          done
