name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports
            api/target/failsafe-reports
          if-no-files-found: ignore

      - name: Docker image builds
        run: docker build -t paycore-api:ci .

  web:
    name: Web lint + type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid

  load:
    name: Load test (k6 against docker-compose)
    runs-on: ubuntu-latest
    needs: api
    env:
      COMPOSE_PROJECT_NAME: paycore
      RATE_LIMIT_CAPACITY: "100000"
      RATE_LIMIT_REFILL_PER_SECOND: "10000"
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose --profile full up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then echo "up after ~$((i*3))s"; exit 0; fi
            sleep 3
          done
          echo "API did not become healthy"; docker compose logs api; exit 1

      - name: Warm-up (no thresholds)
        run: |
          mkdir -p load/results && chmod -R a+rwx load
          docker run --rm --network paycore_default -v "$PWD/load:/load" grafana/k6:latest run -q --no-thresholds \
            -e BASE_URL=http://api:8080 -e VUS=3 -e DURATION=10s /load/checkout.js

      - name: k6 with thresholds from the measured baseline
        run: |
          docker run --rm --network paycore_default -v "$PWD/load:/load" grafana/k6:latest run -q \
            -e BASE_URL=http://api:8080 -e VUS=5 -e DURATION=30s -e P95_MS=250 /load/checkout.js

      - name: Upload load summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-summary
          path: load/results/summary.json
          if-no-files-found: ignore

      - name: API logs on failure
        if: failure()
        run: docker compose logs --tail 200 api

      - name: Tear down
        if: always()
        run: docker compose down -v
